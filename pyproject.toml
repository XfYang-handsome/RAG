    "pydantic (>=2.13.4,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "requests (>=2.34.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "openai (>=3.0.0,<4.0.0)",
    "langchain-openai (>=1.5.0,<2.0.0)",
    "langchain-core (>=1.5.4,<2.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "fastmcp[server] (>=3.4.7,<4.0.0)",
    "pymilvus (>=3.0.1,<4.0.0)",
    "chunklet-py (>=2.4.2,<3.0.0)",
    "pdfminer-six (>=20260107,<20260108)",
    "python-docx (>=1.2.0,<2.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "ebooklib (>=0.20,<0.21)",
    "odfpy (>=1.4.1,<2.0.0)",
    "mailparse (>=1.0.15,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "striprtf (>=0.0.32,<0.0.33)",
    "transformers == 4.46.3",
    "tokenizers == 0.20.3",
    "safetensors (>=0.8.0,<0.9.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "beartype (>=0.22.9,<0.23.0)",
    "pypdf (>=6.16.1,<7.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "chardet (>=7.6.0,<8.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "markdown (>=3.10.3,<4.0.0)",
    "huggingface-hub (>=0.23.2,<1.0)",
    "onnxruntime-gpu (>=1.26.0,<1.27.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "xgboost (>=2.1.4,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "pyclipper (>=1.4.0,<2.0.0)",
    "six (>=1.17.0,<2.0.0)",
    "reportlab (>=5.0.0,<6.0.0)",
    "mammoth (>=1.12.1,<2.0.0)",
    "markdownify (>=1.2.3,<2.0.0)",
    "antlr4-python3-runtime (==4.11.1)",
    "sympy (==1.14.0)",
    "torch (==2.7.1)",
